services:
  mysql:
    image: mysql:9.7.4
    environment:
      MYSQL_DATABASE: mitemau_test
      MYSQL_USER: mitemau_test
      MYSQL_PASSWORD: ${MITEMAU_TEST_DB_PASSWORD:?Use the test environment launcher}
      MYSQL_ROOT_PASSWORD: ${MITEMAU_TEST_DB_ROOT_PASSWORD:?Use the test environment launcher}
    ports:
      - "127.0.0.1:3336:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    volumes:
      - ./backend/migrations:/migrations:ro
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"
