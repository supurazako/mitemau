name: Task
description: Capture the goal and acceptance criteria for a task
body:
  - type: textarea
    id: purpose
    attributes:
      label: Goal
      description: What this task is intended to achieve
      placeholder: Describe what this task should accomplish
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this task to be complete
      placeholder: Describe the completed state in concrete terms
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and related information
      description: MOQT draft version, implementation in use, open questions, related issues, etc.
      placeholder: Add relevant assumptions, decisions, and links
    validations:
      required: false
