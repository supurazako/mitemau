name: タスク
description: 目的と完了条件をそろえて作業を登録します
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: この作業で達成したいこと
      placeholder: 何を実現するためのタスクかを書いてください
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 完了条件
      description: 何ができたら完了か
      placeholder: 完了した状態を具体的に書いてください
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 前提・関連情報
      description: MOQTドラフト版、利用する実装、検討事項、関連Issueなど
      placeholder: 必要な前提やリンクを書いてください
    validations:
      required: false
